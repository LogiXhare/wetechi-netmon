[package]
name = "wetechinetmon-incident-postgres"
description = "PostgreSQL persistence for the incident domain: schema and forward-only refinery migrations (5B-2), and ADR 0034's load-run-flush over it, from the staging store (5B-3(a)) through row mapping, load, flush and the transaction service (5B-3(b)) to retry (5B-3(c)). No connection pool wiring or production database connection yet."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wetechinetmon-incident = { path = "../incident" }
# Workspace-internal crate, not a third-party dependency: the row mapping
# reads the scope, direction, family and severity types the incident
# snapshot carries.
wetechinetmon-detector = { path = "../detector" }
uuid.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
rustls.workspace = true
tokio-postgres-rustls.workspace = true
refinery.workspace = true
# Already used by crates/incident, crates/detector and crates/storage at
# these same requirements; nothing new enters Cargo.lock.
serde = "1"
serde_json = "1"
thiserror.workspace = true
# Already an approved, existing workspace dependency (vendored since
# Phase 2 in crates/collector, crates/storage, tools/flow-replay). The retry
# backoff sleeps with `tokio::time`, and the async PostgreSQL tests use its
# runtime. ADR 0021 keeps Tokio out of crates/incident, not out of this
# adapter.
tokio = { workspace = true }
