[package]
name = "wetechinetmon-incident-postgres"
description = "PostgreSQL persistence for the incident domain: schema and forward-only refinery migrations (5B-2) and the in-memory staging store for ADR 0034's load-run-flush (5B-3(a)). No load/flush SQL, connection pool wiring, or production database connection yet."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wetechinetmon-incident = { path = "../incident" }
uuid.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
rustls.workspace = true
tokio-postgres-rustls.workspace = true
refinery.workspace = true

[dev-dependencies]
# Already an approved, existing workspace dependency (vendored since
# Phase 2 in crates/collector, crates/storage, tools/flow-replay) — used
# here only to drive the async migration smoke test
# (tests/migration_smoke_test.rs), not a new dependency for this crate.
tokio = { workspace = true }
# Workspace-internal crate, not a third-party dependency: the staging-store
# tests build real detection events to drive the unit of work.
wetechinetmon-detector = { path = "../detector" }
