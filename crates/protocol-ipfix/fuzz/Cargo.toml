[package]
name = "wetechinetmon-protocol-ipfix-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Marks this as its own standalone workspace root, so Cargo never tries
# to fold it into the parent wetechi-netmon workspace (this crate lives
# nested inside crates/protocol-ipfix/, which *is* a workspace member) —
# the standard cargo-fuzz convention.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wetechinetmon-protocol-ipfix = { path = ".." }

[[bin]]
name = "decode_message"
path = "fuzz_targets/decode_message.rs"
test = false
doc = false
bench = false
