name: Validate

# Validation-only: no container image, no deployment, no release
# automation. As of Phase 2 this includes real build/test/lint for the
# Rust workspace (crates/, tools/flow-replay) — GitHub-hosted ubuntu-latest
# runners ship a Rust toolchain preinstalled, so no separate toolchain
# action is needed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: markdownlint-cli2
        run: npx -y markdownlint-cli2@0.13.0 "**/*.md" "#node_modules"

  yaml-lint:
    name: YAML syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Validate YAML syntax
        run: |
          set -euo pipefail
          npm install --no-save js-yaml@4
          status=0
          while IFS= read -r -d '' f; do
            node -e "require('js-yaml').load(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" \
              && echo "OK: $f" \
              || { echo "INVALID YAML: $f"; status=1; }
          done < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) -not -path './node_modules/*' -not -path './.git/*' -print0)
          exit "$status"

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gaurav-nelson/github-action-markdown-link-check@499c1e7f3637c131334fa8e937c45144f79d72d2 # v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/mlc_config.json"

  mkdocs-build:
    name: MkDocs Material strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build docs (strict — fails on broken nav/links)
        run: mkdocs build --strict

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --check

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --workspace

  rust-build:
    name: Rust build (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo build --workspace --all-targets
