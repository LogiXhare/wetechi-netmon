name: Fuzz (IPFIX decoder)

# Scheduled/manual only — deliberately not part of validate.yml, since
# fuzzing needs a nightly toolchain that normal builds/tests never
# require (Phase 3 objective 13: "without making nightly mandatory for
# normal builds"). See crates/protocol-ipfix/fuzz/README.md.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzz duration in seconds"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz run decode_message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz target
        working-directory: crates/protocol-ipfix
        run: |
          seconds="${{ github.event.inputs.seconds || '300' }}"
          cargo fuzz run decode_message -- -max_total_time="$seconds"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: crates/protocol-ipfix/fuzz/artifacts/
          if-no-files-found: ignore
